name: Zipsa Shorts Auto Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 1,3,5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
name: Zipsa Shorts Auto Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 1,3,5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow beautifulsoup4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run automated shorts script
        run: |
          python auto_shorts.py

      # 👇 바로 이 부분을 파일의 맨 아랫줄에 톡 붙여넣어 주시면 됩니다!
      - name: Upload Shorts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video-101
          path: output/zipsa_shorts_101.mp4
      - name: Run automated shorts script
        run: |
          python auto_shorts.py

      - name: Upload Shorts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video-101
          path: output/zipsa_shorts_101.mp4
