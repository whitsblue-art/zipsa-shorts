name: Zipsa Shorts Auto Pipeline

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 1,3,5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run automated shorts script
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          python auto_shorts.py

      - name: Upload All Shorts Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-zipsa-shorts
          path: output/zipsa_shorts_*.mp4
