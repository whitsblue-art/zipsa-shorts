name: Zipsa Shorts Auto Pipeline

on:
  workflow_dispatch: # 스마트폰이나 PC에서 버튼(Run workflow)을 눌러 수동으로 즉시 실행할 수 있게 해주는 기능
  schedule:
    - cron: '0 0 * * 1,3,5' # 월, 수, 금 UTC 기준 자정(한국 시간 오전 9시)에 자동 실행되도록 설정

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m __import__('pip').install --upgrade pip
          pip install edge-tts pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run automated shorts script
        run: |
          python auto_shorts.py
