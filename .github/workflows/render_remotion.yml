name: Render Remotion Short

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "content/ 아래 폴더 이름 (예: s01_silicone-pet-hair-remover)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Generate TTS
        run: |
          pip install edge-tts mutagen
          python scripts/tts.py "content/${{ inputs.slug }}/scenes.json"

      - name: Render
        working-directory: remotion
        run: |
          npm ci
          npx remotion browser ensure
          npx remotion render ShortsVideo "out/${{ inputs.slug }}.mp4" --props="../content/${{ inputs.slug }}/scenes.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: |
            remotion/out/${{ inputs.slug }}.mp4
            content/${{ inputs.slug }}/scenes.json
